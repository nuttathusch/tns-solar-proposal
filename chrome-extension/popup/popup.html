<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNS SolarEdge Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 14px;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .status-title {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .status-val {
      font-weight: 700;
      color: #38bdf8;
      word-break: break-all;
    }
    .btn-sync {
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(5, 150, 105, 0.4);
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .btn-sync:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-sync:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-open {
      width: 100%;
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-open:hover {
      background: #475569;
      color: #fff;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(5, 150, 105, 0.2);
      color: #34d399;
      border: 1px solid rgba(5, 150, 105, 0.3);
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="title">TNS SolarEdge Sync</div>
      <div class="subtitle">1-Click Proposal Connector</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-title">สถานะแท็บปัจจุบัน:</div>
    <div id="tab-status" class="status-val">กำลังตรวจสอบ...</div>
  </div>

  <button id="btn-sync-now" class="btn-sync">
    <span>⚡ ดึงข้อมูลจาก SolarEdge เข้า Proposal</span>
  </button>

  <a href="https://nuttathusch.github.io/tns-solar-proposal/" target="_blank" class="btn-open">
    <span>🚀 เปิด TNS Solar Proposal Studio</span>
  </a>

  <div class="footer">
    TNS network solutions Co., Ltd.
  </div>

  <script src="popup.js"></script>
</body>
</html>
